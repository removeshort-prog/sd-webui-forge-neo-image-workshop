name: Image engine tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency
        run: python -m pip install "Pillow>=10" "opencv-python-headless>=4.8"
      - name: Run image and batch regression tests
        run: python -B -m unittest discover -s tests -v
